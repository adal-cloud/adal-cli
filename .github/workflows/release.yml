name: Release
run-name: ${{ inputs.publish && 'Publish' || 'Build' }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (v1.2.3 or v1.2.3-rc.1)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release after successful checks and builds"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and reject an existing tag
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 scripts/build_release.py "$VERSION" --validate-only
          if [[ "$PUBLISH" == true ]] && git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::This version already has a tag. Choose a new version."
            exit 1
          fi

  test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test archive packaging
        run: python3 -m unittest discover -s scripts -v
      - name: Build six platform archives and checksums
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/build_release.py "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: adal-cli-${{ inputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: adal-cli-${{ inputs.version }}
          path: dist
      - name: Verify and publish the exact built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          cd dist
          sha256sum --check checksums.txt
          # Recheck after building: never reuse a tag created by another run.
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::This version already has a tag. Choose a new version."
            exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          # Creating the ref is atomic: a concurrent tag creation must fail.
          gh api "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA" > /dev/null
          printf 'Source commit: `%s`\n\nSix platform archives and SHA-256 checksums.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" ./* \
            --verify-tag \
            --title "Adal CLI $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft "${prerelease[@]}"
          gh release edit "$VERSION" --draft=false
